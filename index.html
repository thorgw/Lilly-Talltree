<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lilly-Talltree Chat Demo</title>
  <style>
    body   { font-family: Arial, sans-serif; margin: 2rem; }
    #log   { border: 1px solid #ccc; padding: 1rem;
             height: 300px; overflow-y: auto; white-space: pre-wrap; }
    #keyField { width: 100%; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Lilly-Talltree</h1>

  <!-- user pastes their own key here -->
  <input id="keyField" type="password"
         placeholder="Paste your OpenAI API key, then ask a question below">

  <!-- chat log -->
  <div id="log"></div>

  <!-- user message box -->
  <input id="msg" style="width:100%; margin-top:0.5rem;"
         placeholder="Type your message and press Enter">

  <script>
    const log = document.getElementById('log');
    const msg = document.getElementById('msg');

    msg.addEventListener('keydown', e => {
      if (e.key === 'Enter') chat(msg.value.trim());
    });

    async function chat(userText) {
      if (!userText) return;

      const apiKey = document.getElementById('keyField').value.trim();
      if (!apiKey) { alert('Paste your API key first.'); return; }

      append('you', userText);
      msg.value = '';

      append('bot', '…');       // placeholder while we wait

      const res = await fetch(
        "https://api.openai.com/v1/chat/completions",
        {
          method: 'POST',
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: userText }]
          })
        }
      );

      const data = await res.json();
      log.lastChild.textContent =
        data.choices?.[0]?.message?.content?.trim() || '[no reply]';
    }

    function append(who, text) {
      const p = document.createElement('p');
      p.textContent = (who === 'you' ? 'You: ' : 'Bot: ') + text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }
  </script>
</body>
</html>
